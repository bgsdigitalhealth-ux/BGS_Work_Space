<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="acuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#704fe6" />
      <stop offset="50%" stop-color="#5a36e6" />
      <stop offset="100%" stop-color="#3b1fb5" />
    </linearGradient>
    <linearGradient id="acuAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
    <filter id="acuShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3b1fb5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#acuGrad)" filter="url(#acuShadow)" />

  <!-- Inner Subtle Border -->
  <rect x="7" y="7" width="86" height="86" rx="23" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Interlocking ACU Geometric Monogram -->
  <!-- 'A' Apex -->
  <path d="M 50 20 L 68 62 L 58 62 L 53.5 50 L 46.5 50 L 42 62 L 32 62 Z M 50 34 L 48 43 L 52 43 Z" fill="#ffffff" />

  <!-- Dynamic 'C' Curve Swoosh -->
  <path d="M 33 42 C 27 46 24 53 25 61 C 27 72 38 78 51 77 C 62 76 71 70 75 63 L 68 58 C 65 63 59 68 51 68 C 42 68 35 63 34 56 C 34 50 37 46 41 43 Z" fill="url(#acuAccent)" opacity="0.95" />

  <!-- Modern Central Core Spark -->
  <circle cx="50" cy="46" r="3" fill="#ffffff" />
</svg>
