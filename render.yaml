services:
  - type: web
    name: bgs-work-space-backend
    env: node
    plan: free
    region: oregon
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/Backend/.cache/puppeteer
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
