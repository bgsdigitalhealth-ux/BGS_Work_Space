services:
  - type: web
    name: bgs-work-space-backend
    env: node
    plan: free
    region: oregon
    rootDir: Backend
    buildCommand: npm install && (npx puppeteer browsers install chrome || true)
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: MONGODB_URI
        sync: false

